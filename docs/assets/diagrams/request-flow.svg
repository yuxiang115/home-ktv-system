<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HomeKTV request and playback flow</title>
  <desc id="desc">Flow diagram showing Android TV QR pairing, mobile song search, queue command, API playback target and NAS media streaming.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #D7E3F1; }
      .stepNum { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F172A; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F8FAFC; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #DCE7F5; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #B6C7DA; }
      .card { fill: rgba(15, 23, 42, 0.78); stroke: rgba(226, 232, 240, 0.18); stroke-width: 1; }
      .line { stroke: #BFDBFE; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="180" fill="#38BDF8" opacity="0.12"/>
  <circle cx="90" cy="475" r="160" fill="#F97316" opacity="0.10"/>

  <text x="70" y="76" class="title">Song Request to Real MV Playback</text>
  <text x="72" y="110" class="subtitle">A full home karaoke loop: TV pairing, phone control, queue command, playback target and NAS media streaming.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="190" height="178" rx="22" class="card"/>
    <circle cx="106" cy="214" r="22" fill="url(#blue)"/>
    <text x="99" y="222" class="stepNum">1</text>
    <text x="92" y="258" class="label">TV shows QR</text>
    <text x="92" y="287" class="small">Android TV 注册房间</text>
    <text x="92" y="313" class="small">持续心跳并显示二维码</text>
    <rect x="92" y="328" width="92" height="8" rx="4" fill="#60A5FA" opacity="0.65"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="304" y="176" width="190" height="178" rx="22" class="card"/>
    <circle cx="340" cy="214" r="22" fill="url(#green)"/>
    <text x="333" y="222" class="stepNum">2</text>
    <text x="326" y="258" class="label">Phone joins</text>
    <text x="326" y="287" class="small">扫码进入控制器</text>
    <text x="326" y="313" class="small">搜索真实曲库并点歌</text>
    <rect x="326" y="328" width="120" height="8" rx="4" fill="#34D399" opacity="0.65"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="538" y="176" width="190" height="178" rx="22" class="card"/>
    <circle cx="574" cy="214" r="22" fill="url(#orange)"/>
    <text x="567" y="222" class="stepNum">3</text>
    <text x="560" y="258" class="label">API queues</text>
    <text x="560" y="287" class="small">写入播放队列</text>
    <text x="560" y="313" class="small">生成 playback target</text>
    <rect x="560" y="328" width="136" height="8" rx="4" fill="#FBBF24" opacity="0.72"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="772" y="176" width="190" height="178" rx="22" class="card"/>
    <circle cx="808" cy="214" r="22" fill="url(#pink)"/>
    <text x="801" y="222" class="stepNum">4</text>
    <text x="794" y="258" class="label">NAS streams</text>
    <text x="794" y="287" class="small">API 读取真实 MV</text>
    <text x="794" y="313" class="small">HTTP Range 媒体流</text>
    <rect x="794" y="328" width="128" height="8" rx="4" fill="#FB7185" opacity="0.70"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1006" y="176" width="190" height="178" rx="22" class="card"/>
    <circle cx="1042" cy="214" r="22" fill="url(#green)"/>
    <text x="1035" y="222" class="stepNum">5</text>
    <text x="1028" y="258" class="label">TV plays MV</text>
    <text x="1028" y="287" class="small">libVLC 解码播放</text>
    <text x="1028" y="313" class="small">支持原唱/伴唱切换</text>
    <rect x="1028" y="328" width="138" height="8" rx="4" fill="#2DD4BF" opacity="0.70"/>
  </g>

  <path class="line" d="M260 265H304"/>
  <path class="line" d="M494 265H538"/>
  <path class="line" d="M728 265H772"/>
  <path class="line" d="M962 265H1006"/>

  <path d="M1100 354C1060 434 296 438 188 354" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="438" y="438" class="tiny">Phone can continue to send skip, priority, vocal mode and volume commands while TV reports playback telemetry.</text>
</svg>
