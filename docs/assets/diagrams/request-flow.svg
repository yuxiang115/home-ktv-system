<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HomeKTV 点歌播放链路图</title>
  <desc id="desc">HomeKTV 从电视注册、手机扫码、搜索点歌、API 排队、NAS 媒体流到 Android TV 播放的中文流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09111F"/>
      <stop offset="0.48" stop-color="#152549"/>
      <stop offset="1" stop-color="#073B35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12" stroke="#C6E6FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .title { font-size: 39px; font-weight: 800; fill: #F8FAFC; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #D5E4F3; }
      .num { font-size: 24px; font-weight: 900; fill: #0F172A; }
      .label { font-size: 22px; font-weight: 800; fill: #F8FAFC; }
      .small { font-size: 14px; font-weight: 500; fill: #DDE9F7; }
      .tiny { font-size: 12px; font-weight: 500; fill: #B4C6DA; }
      .card { fill: #0E1B2F; fill-opacity: 0.88; stroke: #D6E4F5; stroke-opacity: 0.20; stroke-width: 1.2; }
      .line { stroke: #C6E6FF; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .feedback { stroke: #8DD7FF; stroke-width: 2; stroke-dasharray: 7 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="190" fill="#38BDF8" opacity="0.12"/>
  <circle cx="105" cy="505" r="172" fill="#F97316" opacity="0.11"/>
  <circle cx="600" cy="292" r="260" fill="#34D399" opacity="0.06"/>

  <text x="64" y="76" class="font title">点歌到播放的完整链路</text>
  <text x="66" y="112" class="font subtitle">电视端先注册房间并显示二维码，手机扫码点歌，API 维护队列并把 NAS 中的真实 MV 推给播放端。</text>

  <g filter="url(#shadow)">
    <rect x="58" y="188" width="200" height="184" rx="24" class="card"/>
    <circle cx="94" cy="228" r="24" fill="url(#blue)"/>
    <text x="87" y="237" class="font num">1</text>
    <text x="82" y="272" class="font label">电视注册</text>
    <text x="82" y="304" class="font small">Android TV 启动后</text>
    <text x="82" y="330" class="font small">注册房间并显示二维码</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="294" y="188" width="200" height="184" rx="24" class="card"/>
    <circle cx="330" cy="228" r="24" fill="url(#cyan)"/>
    <text x="323" y="237" class="font num">2</text>
    <text x="318" y="272" class="font label">手机扫码</text>
    <text x="318" y="304" class="font small">进入控制端会话</text>
    <text x="318" y="330" class="font small">搜索曲库并提交点歌</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="188" width="200" height="184" rx="24" class="card"/>
    <circle cx="566" cy="228" r="24" fill="url(#amber)"/>
    <text x="559" y="237" class="font num">3</text>
    <text x="554" y="272" class="font label">API 排队</text>
    <text x="554" y="304" class="font small">写入播放队列</text>
    <text x="554" y="330" class="font small">生成播放目标和控制事件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="766" y="188" width="200" height="184" rx="24" class="card"/>
    <circle cx="802" cy="228" r="24" fill="url(#rose)"/>
    <text x="795" y="237" class="font num">4</text>
    <text x="790" y="272" class="font label">读取媒体</text>
    <text x="790" y="304" class="font small">API 从 NAS 读取 MV</text>
    <text x="790" y="330" class="font small">提供 HTTP Range 媒体流</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="982" y="188" width="200" height="184" rx="24" class="card"/>
    <circle cx="1018" cy="228" r="24" fill="url(#green)"/>
    <text x="1011" y="237" class="font num">5</text>
    <text x="1006" y="272" class="font label">电视播放</text>
    <text x="1006" y="304" class="font small">libVLC 解码播放 MV</text>
    <text x="1006" y="330" class="font small">支持原唱/伴唱和音量控制</text>
  </g>

  <path class="line" d="M258 280H294"/>
  <path class="line" d="M494 280H530"/>
  <path class="line" d="M730 280H766"/>
  <path class="line" d="M966 280H982"/>

  <path class="feedback" d="M1096 372C1052 463 297 466 160 372"/>
  <text x="360" y="456" class="font tiny">播放过程中，手机端仍可发送切歌、顶歌、音量、原唱/伴唱等控制命令；电视端持续回报播放状态。</text>

  <rect x="294" y="404" width="612" height="38" rx="19" fill="#0F172A" fill-opacity="0.48" stroke="#67E8F9" stroke-opacity="0.18"/>
  <text x="340" y="428" class="font tiny">队列、房间状态和播放历史写入 PostgreSQL；真实媒体文件仍保留在 NAS 曲库目录。</text>
</svg>
